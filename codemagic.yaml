workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Developer Portal  # Must match the integration name in Codemagic UI > Teams > Integrations
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mathdragonsgame.mathDragons
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios && pod install

      - name: Run unit tests
        script: flutter test

      - name: Boot iOS Simulator
        script: |
          # Find first available iPhone simulator and boot it
          DEVICE_ID=$(xcrun simctl list devices available -j | \
            python3 -c "
          import sys, json
          data = json.load(sys.stdin)['devices']
          for runtime, devices in data.items():
              for d in devices:
                  if 'iPhone' in d['name'] and d['isAvailable']:
                      print(d['udid'])
                      sys.exit(0)
          sys.exit(1)
          ")
          xcrun simctl boot "$DEVICE_ID" || true
          echo "SIMULATOR_UDID=$DEVICE_ID" >> $CM_ENV

      - name: Run integration tests on iOS Simulator
        script: |
          flutter test integration_test/ -d "$SIMULATOR_UDID" --timeout 120s

      - name: Build iOS release
        script: |
          flutter build ipa --release \
            --build-name=$(grep 'version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//') \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        # API key must be configured in Codemagic UI under Teams > Settings
        auth: integration
        submit_to_testflight: true
        expire_build_submitted_for_review: true
