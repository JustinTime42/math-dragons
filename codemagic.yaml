workflows:
  ios-test:
    name: iOS Test
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios && pod install

      - name: Run unit tests
        script: flutter test

      - name: Boot iOS Simulator
        script: |
          # Find first available iPhone simulator and boot it
          DEVICE_ID=$(xcrun simctl list devices available -j | \
            python3 -c "
          import sys, json
          data = json.load(sys.stdin)['devices']
          for runtime, devices in data.items():
              for d in devices:
                  if 'iPhone' in d['name'] and d['isAvailable']:
                      print(d['udid'])
                      sys.exit(0)
          sys.exit(1)
          ")
          xcrun simctl boot "$DEVICE_ID" || true
          echo "SIMULATOR_UDID=$DEVICE_ID" >> $CM_ENV

      - name: Run integration tests on iOS Simulator
        script: |
          flutter test integration_test/ -d "$SIMULATOR_UDID" --timeout 120s
