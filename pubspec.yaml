name: math_dragons
description: Dragon-powered math games that are actually fun!
publish_to: 'none'
version: 1.0.2+6

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # Game Engine (Step 4+)
  flame: ^1.14.0

  # Local Storage (Step 2)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1

  # State Management
  provider: ^6.1.1


  # IAP (Step 11)
  # purchases_flutter: ^6.17.0

  # Audio (Step 12)
  flame_audio: ^2.1.6

  # Animations (Step 12)
  # rive: ^0.12.4

  # Utilities
  equatable: ^2.0.5
  uuid: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/dragons/
    - assets/images/dragons/posed/raw/dragons/hub/stage_0_egg/
    - assets/images/dragons/posed/raw/dragons/hub/stage_1_hatchling/
    - assets/images/dragons/posed/raw/dragons/hub/stage_2_fledgling/
    - assets/images/dragons/posed/raw/dragons/hub/stage_3_young/
    - assets/images/dragons/posed/raw/dragons/hub/stage_4_adult/
    - assets/images/dragons/posed/raw/dragons/hub/stage_5_elder/
    - assets/images/dragons/posed/raw/dragons/portrait/stage_0_egg/
    - assets/images/dragons/posed/raw/dragons/portrait/stage_1_hatchling/
    - assets/images/dragons/posed/raw/dragons/portrait/stage_2_fledgling/
    - assets/images/dragons/posed/raw/dragons/portrait/stage_3_young/
    - assets/images/dragons/posed/raw/dragons/portrait/stage_4_adult/
    - assets/images/dragons/posed/raw/dragons/portrait/stage_5_elder/
    - assets/images/dragons/posed/raw/accessories/hub/stage_1_hatchling/
    - assets/images/dragons/posed/raw/accessories/hub/stage_2_fledgling/
    - assets/images/dragons/posed/raw/accessories/hub/stage_3_young/
    - assets/images/dragons/posed/raw/accessories/hub/stage_4_adult/
    - assets/images/dragons/posed/raw/accessories/hub/stage_5_elder/
    - assets/images/dragons/posed/raw/accessories/portrait/stage_1_hatchling/
    - assets/images/dragons/posed/raw/accessories/portrait/stage_2_fledgling/
    - assets/images/dragons/posed/raw/accessories/portrait/stage_3_young/
    - assets/images/dragons/posed/raw/accessories/portrait/stage_4_adult/
    - assets/images/dragons/posed/raw/accessories/portrait/stage_5_elder/
    - assets/images/hub/
    - assets/images/games/runes/
    - assets/images/games/fire_trail/
    - assets/images/games/dragon_eggs/
    - assets/images/games/dragons_feast/
    - assets/images/ui/
    - assets/animations/
    - assets/audio/music/
    - assets/audio/sfx/

  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Regular.ttf
        - asset: assets/fonts/Cinzel-Bold.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
